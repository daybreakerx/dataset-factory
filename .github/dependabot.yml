# Dependabot —— 自动盯着依赖。
# 现行策略：按需升级、控制变更频率——
#   - 漏洞安全：由仓库设置的「Dependabot 告警 + 安全更新」承担，出漏洞提修复 PR；
#   - GitHub Actions：保留每周检查——只动 CI 文件、零产品风险，能自动跟上「运行时弃用」类到期；
#   - Python 依赖：不自动提版本 PR；升级由人择期整批做（升完跑全量门禁）。
version: 2
updates:
  # CI 用的 GitHub Actions 版本（actions/checkout、astral-sh/setup-uv 等）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
